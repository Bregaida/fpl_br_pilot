# Datasource DEV (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:fpl_user}
quarkus.datasource.password=${POSTGRES_PASSWORD:fpl_pass}
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:fpl}}
quarkus.datasource.jdbc.max-size=16

# Hibernate (update schema - criar/atualizar tabelas automaticamente)
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.log.sql=false


# Mailer (DEV via Mailhog)
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASS:}
quarkus.mailer.start-tls=OPTIONAL
quarkus.mailer.mock=${MAILER_MOCK:false}

# Encryption (DEV) - chave de desenvolvimento, sem valor em producao.
# Base64 de 32 bytes. Trocar por variavel de ambiente em qualquer ambiente real.
MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:ZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZC0zMmJ5dGU=}
